<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppHub Light - 客户端集成平台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --sidebar-w: 240px;
      --titlebar-h: 44px;
      --tabbar-h: 38px;
      --bg: #f5f5f7;
      --sidebar-bg: #ffffff;
      --sidebar-hover: #f3f4f6;
      --sidebar-active: #e5e7eb;
      --card-bg: #ffffff;
      --card-hover: #f9fafb;
      --accent: #3b82f6;
      --accent2: #8b5cf6;
      --green: #10b981;
      --orange: #f59e0b;
      --pink: #ef4444;
      --yellow: #eab308;
      --teal: #14b8a6;
      --text: #111827;
      --text-sec: #4b5563;
      --text-dim: #9ca3af;
      --border: #e5e7eb;
      --tab-bg: #f9fafb;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
    }
    body {
      font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ===== Title Bar ===== */
    .titlebar {
      height: var(--titlebar-h);
      background: var(--sidebar-bg);
      display: flex;
      align-items: center;
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      user-select: none;
    }
    .titlebar .logo {
      width: 26px; height: 26px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: bold; color: #fff;
    }
    .titlebar .title {
      margin-left: 10px; font-size: 13px; font-weight: 600;
    }
    .titlebar .nav-btns {
      margin-left: 20px;
      display: flex; gap: 4px;
    }
    .nav-btn {
      padding: 5px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-dim);
      background: transparent;
      border: none;
      font-family: inherit;
    }
    .nav-btn:hover { background: var(--sidebar-hover); color: var(--text); }
    .nav-btn.active { background: var(--accent); color: #fff; font-weight: 600; }

    .titlebar .spacer { flex: 1; }
    .win-controls { display: flex; gap: 8px; }
    .win-controls span {
      width: 13px; height: 13px; border-radius: 50%; cursor: pointer;
    }
    .wc-min { background: var(--yellow); }
    .wc-max { background: var(--green); }
    .wc-cls { background: var(--pink); }

    /* ===== Main Layout ===== */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* ===== Sidebar ===== */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.3s;
      overflow: hidden;
    }
    .sidebar.collapsed { width: 56px; }

    .sidebar-toggle {
      padding: 10px 14px;
      display: flex; align-items: center; justify-content: flex-end;
      cursor: pointer;
    }
    .sidebar-toggle span {
      font-size: 18px; color: var(--text-dim); transition: transform 0.3s;
    }
    .sidebar.collapsed .sidebar-toggle span { transform: rotate(180deg); }

    /* Sidebar Search */
    .sb-search {
      padding: 0 12px 8px;
      position: relative;
    }
    .sb-search input {
      width: 100%;
      height: 32px;
      background: var(--sidebar-hover);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px 0 30px;
      color: var(--text);
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .sb-search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }
    .sb-search input::placeholder { color: var(--text-dim); }
    .sb-search .si {
      position: absolute; left: 22px; top: 8px;
      font-size: 12px; color: var(--text-dim); pointer-events: none;
    }
    .sidebar.collapsed .sb-search { display: none; }

    /* Category Tags */
    .cat-tags {
      padding: 4px 12px 6px;
      display: flex; gap: 4px; flex-wrap: wrap;
    }
    .cat-tag {
      padding: 3px 10px; border-radius: 10px;
      font-size: 11px; cursor: pointer;
      color: var(--text-dim); transition: all 0.15s;
      border: none; background: transparent; font-family: inherit;
    }
    .cat-tag:hover { background: var(--sidebar-hover); color: var(--text); }
    .cat-tag.active { background: var(--accent); color: #fff; font-weight: 600; }
    .sidebar.collapsed .cat-tags { display: none; }

    /* App List */
    .app-list {
      flex: 1; overflow-y: auto; padding: 4px 8px;
    }
    .app-list::-webkit-scrollbar { width: 3px; }
    .app-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .al-section { font-size: 10px; font-weight: 700; color: var(--text-dim); padding: 8px 8px 4px; text-transform: uppercase; letter-spacing: 0.5px; }

    .al-item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 8px; border-radius: 8px;
      cursor: pointer; transition: all 0.15s; margin-bottom: 1px;
      position: relative;
    }
    .al-item:hover { background: var(--sidebar-hover); }
    .al-item.active { background: var(--sidebar-active); }

    .al-icon {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #fff;
      flex-shrink: 0; position: relative;
    }
    .al-dot {
      position: absolute; bottom: -1px; right: -1px;
      width: 8px; height: 8px;
      background: var(--green);
      border-radius: 50%;
      border: 2px solid var(--sidebar-bg);
    }
    .al-info { flex: 1; min-width: 0; }
    .al-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .al-desc { font-size: 10px; color: var(--text-dim); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .al-badge {
      font-size: 9px; padding: 1px 6px; border-radius: 8px;
      background: rgba(16,185,129,0.1); color: var(--green); font-weight: 600;
      flex-shrink: 0;
    }
    .sidebar.collapsed .al-info,
    .sidebar.collapsed .al-badge,
    .sidebar.collapsed .al-section { display: none; }
    .sidebar.collapsed .al-item { justify-content: center; padding: 7px; }

    /* Sidebar Footer */
    .sb-footer {
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      display: flex; gap: 6px;
    }
    .sb-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 10px; border-radius: 6px;
      font-size: 11px; color: var(--text-dim);
      cursor: pointer; transition: all 0.15s;
      border: none; background: transparent; font-family: inherit;
    }
    .sb-btn:hover { background: var(--sidebar-hover); color: var(--text); }
    .sidebar.collapsed .sb-btn span:last-child { display: none; }

    /* ===== Content ===== */
    .content {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; position: relative;
    }

    /* ===== Views ===== */
    .view {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .view.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.97);
    }

    /* ===== HOME VIEW ===== */
    .home-view {
      overflow-y: auto;
      align-items: center;
      padding: 48px 32px 40px;
    }
    .home-header {
      text-align: center; margin-bottom: 32px;
    }
    .home-logo {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 16px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: bold; color: #fff;
      box-shadow: 0 8px 32px rgba(59,130,246,0.2);
      margin-bottom: 14px;
    }
    .home-header h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
    .home-header p { font-size: 13px; color: var(--text-dim); }

    .home-search {
      width: 100%; max-width: 400px;
      margin-bottom: 36px; position: relative;
    }
    .home-search input {
      width: 100%; height: 42px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 16px 0 38px;
      color: var(--text); font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: var(--shadow-sm);
    }
    .home-search input::placeholder { color: var(--text-dim); }
    .home-search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }
    .home-search .hsi {
      position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%);
      font-size: 15px; color: var(--text-dim);
    }
    .home-search .hs-hint {
      position: absolute; right: 10px; top: 50%;
      transform: translateY(-50%);
      font-size: 10px; color: var(--text-dim);
      background: var(--sidebar-hover);
      padding: 2px 7px; border-radius: 4px;
      border: 1px solid var(--border);
    }

    /* App Grid */
    .home-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(116px, 1fr));
      gap: 16px;
      width: 100%; max-width: 720px;
    }
    .home-card {
      display: flex; flex-direction: column;
      align-items: center; gap: 8px;
      padding: 22px 10px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .home-card:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }
    .home-card:active { transform: translateY(0); }
    .hc-icon {
      width: 48px; height: 48px; border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; color: #fff;
    }
    .hc-name { font-size: 12px; font-weight: 500; }
    .hc-desc { font-size: 10px; color: var(--text-dim); }

    /* ===== WORKSPACE VIEW ===== */
    /* Tab Bar */
    .tabbar {
      height: var(--tabbar-h);
      background: var(--tab-bg);
      display: flex; align-items: flex-end;
      padding: 0 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow-x: auto;
    }
    .tabbar::-webkit-scrollbar { height: 0; }
    .tab {
      display: flex; align-items: center; gap: 7px;
      padding: 0 12px; height: 32px;
      border-radius: 7px 7px 0 0;
      cursor: pointer; transition: all 0.15s;
      flex-shrink: 0; font-size: 11px;
      color: var(--text-dim); position: relative;
      margin-right: 2px;
    }
    .tab:hover { color: var(--text-sec); background: rgba(0,0,0,0.03); }
    .tab.active { background: #fff; color: var(--text); box-shadow: var(--shadow-sm); }
    .tab.active::after {
      content: ''; position: absolute;
      bottom: 0; left: 12px; right: 12px;
      height: 2px; background: var(--accent);
      border-radius: 2px 2px 0 0;
    }
    .tab-icon {
      width: 16px; height: 16px; border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    .tab-close {
      width: 14px; height: 14px; border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: var(--text-dim);
      transition: all 0.15s;
    }
    .tab-close:hover { background: rgba(239,68,68,0.1); color: var(--pink); }
    .tab-new {
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 5px; cursor: pointer;
      color: var(--text-dim); font-size: 16px;
      transition: all 0.15s; align-self: center;
      margin-left: 4px;
    }
    .tab-new:hover { background: var(--sidebar-hover); color: var(--text); }

    /* Embedded Area */
    .embed-area {
      flex: 1; position: relative; overflow: hidden;
    }

    /* Toolbar */
    .embed-toolbar {
      height: 30px;
      background: #fff;
      display: flex; align-items: center;
      padding: 0 12px; gap: 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .et-status {
      display: flex; align-items: center; gap: 5px;
      font-size: 10px; color: var(--green);
    }
    .et-dot {
      width: 5px; height: 5px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .et-actions { margin-left: auto; display: flex; gap: 4px; }
    .et-btn {
      padding: 2px 8px; border-radius: 4px;
      font-size: 10px; cursor: pointer;
      color: var(--text-sec); border: 1px solid var(--border);
      background: transparent; font-family: inherit;
      transition: all 0.15s;
    }
    .et-btn:hover { background: var(--sidebar-hover); color: var(--text); }
    .et-btn.danger:hover { background: rgba(239,68,68,0.05); color: var(--pink); border-color: var(--pink); }

    /* Embed Viewport - simulated exe */
    .embed-vp {
      flex: 1; background: #fafbfc;
      display: flex; flex-direction: column;
      height: calc(100% - 30px);
    }
    .exe-top {
      height: 26px; background: #f3f4f6;
      display: flex; align-items: center;
      padding: 0 12px; gap: 14px;
      font-size: 11px; color: var(--text-sec);
      border-bottom: 1px solid var(--border);
    }
    .exe-top .exe-brand { font-weight: 600; color: var(--accent); }
    .exe-top span { cursor: pointer; }
    .exe-top span:hover { color: var(--text); }
    .exe-body { flex: 1; display: flex; }
    .exe-side {
      width: 160px; background: #f9fafb;
      padding: 10px; flex-shrink: 0;
      border-right: 1px solid var(--border);
    }
    .exe-side-item {
      padding: 5px 8px; border-radius: 4px;
      font-size: 11px; color: var(--text-dim);
      margin-bottom: 2px;
    }
    .exe-side-item.sel { background: rgba(59,130,246,0.08); color: var(--accent); }
    .exe-main {
      flex: 1; padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
      overflow-y: auto;
    }
    .exe-main h4 { font-size: 13px; font-weight: 500; color: var(--text-sec); }
    .mock-bar {
      height: 32px;
      background: #f3f4f6;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .mock-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px; flex: 1;
    }
    .mock-cell {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .mock-line {
      height: 8px; background: #e5e7eb;
      border-radius: 2px;
    }
    .mock-line.short { width: 55%; }
    .mock-block { flex: 1; background: #f3f4f6; border-radius: 3px; }

    /* Empty workspace (no tabs) */
    .ws-empty {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; color: var(--text-dim);
    }
    .ws-empty .ws-empty-icon {
      font-size: 48px; opacity: 0.3;
    }
    .ws-empty p { font-size: 14px; }
    .ws-empty .ws-hint {
      font-size: 12px;
      padding: 6px 14px;
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #fff;
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 12px;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none; z-index: 999;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Colors */
    .c1 { background: linear-gradient(135deg, #3b82f6, #06b6d4); }
    .c2 { background: linear-gradient(135deg, #10b981, #14b8a6); }
    .c3 { background: linear-gradient(135deg, #8b5cf6, #a78bfa); }
    .c4 { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
    .c5 { background: linear-gradient(135deg, #ef4444, #f87171); }
    .c6 { background: linear-gradient(135deg, #14b8a6, #22d3ee); }
  </style>
</head>
<body>

  <!-- Title Bar -->
  <div class="titlebar">
    <div class="logo">P</div>
    <span class="title">AppHub</span>
    <div class="nav-btns">
      <button class="nav-btn active" id="btnHome" onclick="switchView('home')">&#9776; 首页</button>
      <button class="nav-btn" id="btnWork" onclick="switchView('workspace')">&#9638; 工作台</button>
    </div>
    <div class="spacer"></div>
    <div class="win-controls">
      <span class="wc-min"></span>
      <span class="wc-max"></span>
      <span class="wc-cls"></span>
    </div>
  </div>

  <div class="main">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-toggle" onclick="toggleSidebar()">
        <span>&#9664;</span>
      </div>
      <div class="sb-search">
        <span class="si">&#128269;</span>
        <input type="text" placeholder="搜索应用..." id="sbSearch" oninput="filterSidebar(this.value)">
      </div>
      <div class="cat-tags" id="catTags">
        <button class="cat-tag active" data-cat="all" onclick="filterCat('all', this)">全部</button>
        <button class="cat-tag" data-cat="dev" onclick="filterCat('dev', this)">开发</button>
        <button class="cat-tag" data-cat="design" onclick="filterCat('design', this)">设计</button>
        <button class="cat-tag" data-cat="office" onclick="filterCat('office', this)">办公</button>
        <button class="cat-tag" data-cat="data" onclick="filterCat('data', this)">数据</button>
      </div>
      <div class="app-list" id="appList"></div>
      <div class="sb-footer">
        <button class="sb-btn"><span>&#9881;</span><span>管理</span></button>
        <button class="sb-btn"><span>&#10010;</span><span>添加</span></button>
      </div>
    </div>

    <!-- Content -->
    <div class="content">

      <!-- HOME VIEW -->
      <div class="view home-view" id="homeView">
        <div class="home-header">
          <div class="home-logo">P</div>
          <h2>选择应用启动</h2>
          <p>点击应用图标以打开，支持多应用同时运行</p>
        </div>
        <div class="home-search">
          <span class="hsi">&#128269;</span>
          <input type="text" id="homeSearch" placeholder="搜索应用..." oninput="filterHome(this.value)">
          <span class="hs-hint">Ctrl+K</span>
        </div>
        <div class="home-grid" id="homeGrid"></div>
      </div>

      <!-- WORKSPACE VIEW -->
      <div class="view workspace-view hidden" id="workspaceView">
        <div class="tabbar" id="tabBar">
          <div class="tab-new" onclick="switchView('home')" title="打开新应用">+</div>
        </div>
        <div class="embed-area" id="embedArea">
          <div class="ws-empty" id="wsEmpty">
            <div class="ws-empty-icon">&#9638;</div>
            <p>暂无打开的应用</p>
            <div class="ws-hint">从首页或侧边栏选择应用启动</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ===== App Data =====
    const apps = [
      { id: 'vscode',   name: 'VS Code',         desc: '代码编辑器',   cat: 'dev',    color: 'c1', abbr: 'VS', section: '常用' },
      { id: 'chrome',   name: 'Chrome DevTools',  desc: '浏览器调试',   cat: 'dev',    color: 'c4', abbr: 'Ch', section: '常用' },
      { id: 'terminal', name: 'Terminal',          desc: '命令行终端',   cat: 'dev',    color: 'c2', abbr: '>_', section: '常用' },
      { id: 'figma',    name: 'Figma',             desc: 'UI 设计工具',  cat: 'design', color: 'c3', abbr: 'Fi', section: '设计' },
      { id: 'docker',   name: 'Docker',            desc: '容器管理',     cat: 'dev',    color: 'c1', abbr: 'Dk', section: '开发工具' },
      { id: 'postman',  name: 'Postman',           desc: 'API 测试',     cat: 'dev',    color: 'c4', abbr: 'Pm', section: '开发工具' },
      { id: 'dbeaver',  name: 'DBeaver',           desc: '数据库管理',   cat: 'data',   color: 'c6', abbr: 'Db', section: '开发工具' },
      { id: 'notion',   name: 'Notion',            desc: '笔记与文档',   cat: 'office', color: 'c3', abbr: 'No', section: '办公' },
      { id: 'dingtalk', name: '钉钉',              desc: '企业通讯',     cat: 'office', color: 'c1', abbr: 'DT', section: '办公' },
      { id: 'wps',      name: 'WPS Office',        desc: '办公文档',     cat: 'office', color: 'c4', abbr: 'WP', section: '办公' },
    ];

    let openTabs = [];
    let activeTab = null;
    let currentView = 'home';

    function renderHomeGrid(filter = '') {
      const grid = document.getElementById('homeGrid');
      const q = filter.toLowerCase();
      grid.innerHTML = apps
        .filter(a => !q || a.name.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q))
        .map(a => `
          <div class="home-card" onclick="launchApp('${a.id}')">
            <div class="hc-icon ${a.color}">${a.abbr}</div>
            <span class="hc-name">${a.name}</span>
            <span class="hc-desc">${a.desc}</span>
          </div>
        `).join('');
    }

    function renderSidebar(filter = '', cat = 'all') {
      const list = document.getElementById('appList');
      const q = filter.toLowerCase();
      const filtered = apps.filter(a => {
        if (cat !== 'all' && a.cat !== cat) return false;
        if (q && !a.name.toLowerCase().includes(q) && !a.desc.toLowerCase().includes(q)) return false;
        return true;
      });
      const sections = {};
      filtered.forEach(a => { if (!sections[a.section]) sections[a.section] = []; sections[a.section].push(a); });
      let html = '';
      for (const [sec, items] of Object.entries(sections)) {
        html += `<div class="al-section">${sec}</div>`;
        items.forEach(a => {
          const isOpen = openTabs.some(t => t.id === a.id);
          html += `
            <div class="al-item ${activeTab === a.id ? 'active' : ''}" onclick="launchApp('${a.id}')">
              <div class="al-icon ${a.color}">
                ${a.abbr}
                ${isOpen ? '<div class="al-dot"></div>' : ''}
              </div>
              <div class="al-info">
                <div class="al-name">${a.name}</div>
                <div class="al-desc">${a.desc}</div>
              </div>
              ${isOpen ? '<span class="al-badge">运行中</span>' : ''}
            </div>`;
        });
      }
      list.innerHTML = html;
    }

    function launchApp(id) {
      const appData = apps.find(a => a.id === id);
      if (!appData) return;
      if (openTabs.some(t => t.id === id)) { activateTab(id); switchView('workspace'); return; }
      openTabs.push(appData);
      activeTab = id;
      switchView('workspace');
      renderTabs();
      renderEmbed(id);
      renderSidebar(document.getElementById('sbSearch').value, getActiveCat());
      showToast('已启动 ' + appData.name);
    }

    function renderTabs() {
      const bar = document.getElementById('tabBar');
      let html = openTabs.map(t => `
        <div class="tab ${activeTab === t.id ? 'active' : ''}" onclick="activateTab('${t.id}')">
          <div class="tab-icon ${t.color}">${t.abbr}</div>
          <span>${t.name}</span>
          <div class="tab-close" onclick="event.stopPropagation(); closeTab('${t.id}')">&times;</div>
        </div>`).join('');
      html += `<div class="tab-new" onclick="switchView('home')" title="打开新应用">+</div>`;
      bar.innerHTML = html;
    }

    function activateTab(id) {
      activeTab = id;
      renderTabs(); renderEmbed(id);
      renderSidebar(document.getElementById('sbSearch').value, getActiveCat());
    }

    function closeTab(id) {
      openTabs = openTabs.filter(t => t.id !== id);
      if (activeTab === id) activeTab = openTabs.length > 0 ? openTabs[openTabs.length - 1].id : null;
      renderTabs();
      if (activeTab) { renderEmbed(activeTab); }
      else {
        document.getElementById('embedArea').innerHTML = `<div class="ws-empty"><div class="ws-empty-icon">&#9638;</div><p>暂无打开的应用</p><div class="ws-hint">从首页或侧边栏选择应用启动</div></div>`;
      }
      renderSidebar(document.getElementById('sbSearch').value, getActiveCat());
      if (openTabs.length === 0) switchView('home');
    }

    function renderEmbed(id) {
      const app = apps.find(a => a.id === id);
      if (!app) return;
      const pid = Math.floor(Math.random() * 20000) + 5000;
      document.getElementById('embedArea').innerHTML = `
        <div style="display:flex;flex-direction:column;height:100%;">
          <div class="embed-toolbar">
            <div class="et-status"><span class="et-dot"></span><span>${app.name} - PID: ${pid}</span></div>
            <div class="et-actions">
              <button class="et-btn" onclick="showToast('已刷新 ${app.name}')">&#8635; 刷新</button>
              <button class="et-btn" onclick="showToast('已置顶')">&#8593; 置顶</button>
              <button class="et-btn" onclick="showToast('已弹出为独立窗口')">&#9744; 独立窗口</button>
              <button class="et-btn danger" onclick="closeTab('${app.id}')">&#10005; 关闭</button>
            </div>
          </div>
          <div class="embed-vp">
            <div class="exe-top">
              <span class="exe-brand">${app.name}</span>
              <span>文件(F)</span><span>编辑(E)</span><span>查看(V)</span><span>帮助(H)</span>
            </div>
            <div class="exe-body">
              <div class="exe-side">
                <div class="exe-side-item sel">&#128193; 项目</div>
                <div class="exe-side-item">&#128269; 搜索</div>
                <div class="exe-side-item">&#128260; 版本控制</div>
                <div class="exe-side-item">&#128027; 调试</div>
                <div class="exe-side-item">&#9881; 设置</div>
              </div>
              <div class="exe-main">
                <h4>${app.name} - 工作区</h4>
                <div class="mock-bar"></div>
                <div class="mock-bar" style="width:75%;"></div>
                <div class="mock-grid">
                  ${Array(6).fill('<div class="mock-cell"><div class="mock-line"></div><div class="mock-line short"></div><div class="mock-block"></div></div>').join('')}
                </div>
              </div>
            </div>
          </div>
        </div>`;
    }

    function switchView(view) {
      currentView = view;
      const home = document.getElementById('homeView');
      const work = document.getElementById('workspaceView');
      const btnH = document.getElementById('btnHome');
      const btnW = document.getElementById('btnWork');
      if (view === 'home') {
        home.classList.remove('hidden'); work.classList.add('hidden');
        btnH.classList.add('active'); btnW.classList.remove('active');
      } else {
        home.classList.add('hidden'); work.classList.remove('hidden');
        btnH.classList.remove('active'); btnW.classList.add('active');
        if (openTabs.length === 0) {
          document.getElementById('embedArea').innerHTML = `<div class="ws-empty"><div class="ws-empty-icon">&#9638;</div><p>暂无打开的应用</p><div class="ws-hint">从首页或侧边栏选择应用启动</div></div>`;
        }
      }
    }

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
    function filterSidebar(q) { renderSidebar(q, getActiveCat()); }
    function getActiveCat() { const a = document.querySelector('.cat-tag.active'); return a ? a.dataset.cat : 'all'; }
    function filterCat(cat, el) {
      document.querySelectorAll('.cat-tag').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      renderSidebar(document.getElementById('sbSearch').value, cat);
    }
    function filterHome(q) { renderHomeGrid(q); }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
    }

    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        if (currentView === 'home') document.getElementById('homeSearch').focus();
        else document.getElementById('sbSearch').focus();
      }
      if ((e.ctrlKey || e.metaKey) && e.key === '1') { e.preventDefault(); switchView('home'); }
      if ((e.ctrlKey || e.metaKey) && e.key === '2') { e.preventDefault(); switchView('workspace'); }
    });

    renderHomeGrid();
    renderSidebar();
  </script>
</body>
</html>
