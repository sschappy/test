<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppHub - 应用启动器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f0f1a;
      --card-bg: #1a1a2e;
      --card-hover: #252542;
      --accent: #89b4fa;
      --text: #cdd6f4;
      --text-dim: #6c7086;
      --border: #313244;
    }
    body {
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header .logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #89b4fa, #cba6f7);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      color: #1a1a2e;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(137, 180, 250, 0.25);
    }
    .header h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 14px;
      color: var(--text-dim);
    }

    /* Search */
    .search-wrap {
      width: 100%;
      max-width: 420px;
      margin-bottom: 40px;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      height: 44px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 16px 0 42px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-wrap input::placeholder { color: var(--text-dim); }
    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(137, 180, 250, 0.15);
    }
    .search-wrap .icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 16px;
    }

    /* Grid */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 780px;
    }

    /* App Card */
    .app-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 24px 12px 18px;
      background: var(--card-bg);
      border: 1px solid transparent;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .app-card:hover {
      background: var(--card-hover);
      border-color: var(--border);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    .app-card:active {
      transform: translateY(0);
    }

    .app-card .icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      flex-shrink: 0;
    }
    .app-card .icon.c1 { background: linear-gradient(135deg, #89b4fa, #74c7ec); }
    .app-card .icon.c2 { background: linear-gradient(135deg, #a6e3a1, #94e2d5); }
    .app-card .icon.c3 { background: linear-gradient(135deg, #cba6f7, #b4befe); }
    .app-card .icon.c4 { background: linear-gradient(135deg, #fab387, #f9e2af); }
    .app-card .icon.c5 { background: linear-gradient(135deg, #f38ba8, #eba0ac); }
    .app-card .icon.c6 { background: linear-gradient(135deg, #94e2d5, #89dceb); }

    .app-card .name {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.3;
    }
    .app-card .desc {
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.3;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--card-bg);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 10px 24px;
      border-radius: 10px;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">P</div>
    <h1>AppHub</h1>
    <p>选择应用以启动</p>
  </div>

  <div class="search-wrap">
    <span class="icon">&#128269;</span>
    <input type="text" id="searchInput" placeholder="搜索应用...">
  </div>

  <div class="app-grid" id="appGrid">
    <div class="app-card" data-name="Visual Studio Code" data-desc="代码编辑器">
      <div class="icon c1">VS</div>
      <span class="name">VS Code</span>
      <span class="desc">代码编辑器</span>
    </div>
    <div class="app-card" data-name="Chrome DevTools" data-desc="浏览器调试">
      <div class="icon c4">Ch</div>
      <span class="name">Chrome</span>
      <span class="desc">浏览器调试</span>
    </div>
    <div class="app-card" data-name="Windows Terminal" data-desc="命令行终端">
      <div class="icon c2">&gt;_</div>
      <span class="name">Terminal</span>
      <span class="desc">命令行终端</span>
    </div>
    <div class="app-card" data-name="Docker Desktop" data-desc="容器管理">
      <div class="icon c1">Dk</div>
      <span class="name">Docker</span>
      <span class="desc">容器管理</span>
    </div>
    <div class="app-card" data-name="Figma Desktop" data-desc="UI设计工具">
      <div class="icon c3">Fi</div>
      <span class="name">Figma</span>
      <span class="desc">UI 设计工具</span>
    </div>
    <div class="app-card" data-name="Postman" data-desc="API测试">
      <div class="icon c4">Pm</div>
      <span class="name">Postman</span>
      <span class="desc">API 测试</span>
    </div>
    <div class="app-card" data-name="DBeaver" data-desc="数据库管理">
      <div class="icon c6">Db</div>
      <span class="name">DBeaver</span>
      <span class="desc">数据库管理</span>
    </div>
    <div class="app-card" data-name="Notion" data-desc="笔记与文档">
      <div class="icon c3">No</div>
      <span class="name">Notion</span>
      <span class="desc">笔记与文档</span>
    </div>
    <div class="app-card" data-name="WPS Office" data-desc="办公文档">
      <div class="icon c4">WP</div>
      <span class="name">WPS Office</span>
      <span class="desc">办公文档</span>
    </div>
    <div class="app-card" data-name="钉钉" data-desc="企业通讯">
      <div class="icon c1">DT</div>
      <span class="name">钉钉</span>
      <span class="desc">企业通讯</span>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // Search filter
    document.getElementById('searchInput').addEventListener('input', function () {
      const q = this.value.toLowerCase();
      document.querySelectorAll('.app-card').forEach(card => {
        const name = card.dataset.name.toLowerCase();
        const desc = card.dataset.desc.toLowerCase();
        card.style.display = (name.includes(q) || desc.includes(q)) ? '' : 'none';
      });
    });

    // Click to launch
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    document.querySelectorAll('.app-card').forEach(card => {
      card.addEventListener('click', () => {
        const name = card.dataset.name;
        showToast('正在启动 ' + name + ' ...');
        // 实际环境中这里会通过 Electron / CEF / Win32 API 启动对应 exe
      });
    });

    // Keyboard: Ctrl+K focuses search
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
    });
  </script>

</body>
</html>
